  .stop .edit{position:absolute;top:10px;right:34px;width:auto;background:transparent;color:var(--muted);padding:2px 6px;font-size:1rem;}
  .stop .edit:hover{color:var(--accent);}

  .suggest-item:hover{background:var(--bg);}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(26,16,6,0.3);border-top-color:#1a1006;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  button:disabled{opacity:0.7;cursor:not-allowed;}
  .status{font-size:0.8rem;margin-top:6px;min-height:1em;}
  .status.err{color:#e8746a;}
  .status.ok{color:var(--route);}

<body>
<div id="authScreen" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;font-family:'Inter',sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;">
  <div style="background:var(--panel);padding:28px;border-radius:10px;width:320px;border:1px solid var(--line);">
    <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.3rem;margin:0 0 4px;color:var(--text);">Rejseoverblik</h1>
    <div style="color:var(--muted);font-size:0.85rem;margin-bottom:18px;">Log ind for at se din rejseplan — dine etaper følger med, uanset hvilken enhed du bruger.</div>
    <input id="authEmail" type="email" placeholder="E-mail" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:inherit;font-size:0.9rem;margin-bottom:10px;box-sizing:border-box;">
    <input id="authPassword" type="password" placeholder="Adgangskode (mindst 6 tegn)" style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-family:inherit;font-size:0.9rem;margin-bottom:10px;box-sizing:border-box;">
    <button id="authLoginBtn" style="width:100%;background:var(--accent);color:#1a1006;border:none;padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;margin-bottom:8px;">Log ind</button>
    <button id="authSignupBtn" style="width:100%;background:transparent;border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:6px;cursor:pointer;">Opret ny bruger</button>
    <div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:0.75rem;margin:14px 0;">
      <div style="flex:1;height:1px;background:var(--line);"></div>eller<div style="flex:1;height:1px;background:var(--line);"></div>
    </div>
    <button id="authGoogleBtn" style="width:100%;background:#fff;color:#1a1a1a;border:1px solid var(--line);padding:9px 14px;border-radius:6px;cursor:pointer;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.9 6.1C12.3 13 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.5-4.1 7.1-10.2 7.1-17.6z"/><path fill="#FBBC05" d="M10.4 19.3c-.5 1.5-.8 3.1-.8 4.7s.3 3.2.8 4.7l-7.9 6.1C1 31.7 0 27.9 0 24s1-7.7 2.5-10.8l7.9 6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.6-2.1 15.5-5.6l-7.6-5.9c-2.1 1.4-4.8 2.3-7.9 2.3-6.4 0-11.7-3.5-13.6-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>

    </div>

      <select id="stopType">

        <option value="transport">Båd</option>
        <option value="train">Tog</option>
        <option value="aktivitet">Aktivitet</option>
      </select>
      <div id="singleAddressField">
        <input id="stopAddress" placeholder="Adresse eller sted (fx Rom, Italien)">

          <input id="bookingUrl" placeholder="Link til Booking.com eller hotellets hjemmeside (valgfrit)">
          <input id="imageUrlInput" placeholder="Billede-link (valgfrit) – indsæt selv, hvis automatisk hentning fejler">
        </div>
      </div>

        <input id="stopTo" placeholder="Til (fx Rom Fiumicino) – vælg fra listen, eller indsæt koordinater/link">

        <input id="stopEnd" type="date">

      <div class="status" id="addStatus"></div>
    </fieldset>

    <div id="stopList"></div>
  </div>
  <button id="sidebarToggle" title="Minimer/vis panel">‹</button>
  <div id="map"></div>
</div>

<script>
let map, stops = [], markers = [], mapLoaded = false, viaCount = 0, editingId = null, hasFitBounds = false, markerIndex = {};

function isLegType(type){ return type === 'fly' || type === 'transport' || type === 'train'; }

function typeLabel(type){
  return { hotel:'Hotel', fly:'Fly', transport:'Båd', train:'Tog', aktivitet:'Aktivitet' }[type] || type;
}

function legColor(type){
  if(type === 'fly') return 'var(--fly)';
  if(type === 'train') return 'var(--train)';
  return 'var(--boat)'; // transport (Båd)
}

const ICON_PATHS = {
  hotel: '<path d="M3 18v-7a2 2 0 0 1 2-2h3v4"/><path d="M2 18h20"/><path d="M8 13h11a2 2 0 0 1 2 2v3"/>',
  fly: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>',
  transport: '<path d="M3 17c3 1.6 15 1.6 18 0"/><path d="M7 13V8h3v-2h2v2h1l3 5"/><path d="M2 20h20"/>',
  train: '<rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10.5h14"/><path d="M8.5 19.5 7 22M15.5 19.5 17 22"/><circle cx="9" cy="13" r="0.9" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="0.9" fill="currentColor" stroke="none"/>',
  aktivitet: '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.4"/>',
  car: '<path d="M3 17v-4l2-5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2l2 5v4"/><path d="M3 14h18"/><circle cx="7.5" cy="17" r="1.6" fill="currentColor" stroke="none"/><circle cx="16.5" cy="17" r="1.6" fill="currentColor" stroke="none"/>'
};

function iconSvg(type, opts){
  opts = opts || {};
  const size = opts.size || 20;
  const stroke = opts.stroke || 'currentColor';
  const path = ICON_PATHS[type] || ICON_PATHS.aktivitet;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block;">${path}</svg>`;
}

function legIcon(type){
  const stroke = type === 'fly' ? '#1a1006' : '#fff';
  return iconSvg(type, { size: 15, stroke });
}

function typeIcon(type){
  return iconSvg(type, { size: 19, stroke: 'var(--text)' });
}

function attachPlaceAutocomplete(inputEl){
  const wrapper = document.createElement('div');
  wrapper.className = 'suggest-wrap';
  inputEl.parentNode.insertBefore(wrapper, inputEl);
  wrapper.appendChild(inputEl);
  const list = document.createElement('div');
  list.className = 'suggest-list';
  list.style.display = 'none';
  wrapper.appendChild(list);
  const statusLine = document.createElement('div');
  statusLine.style.cssText = 'font-size:0.72rem;color:var(--muted);margin:-6px 0 8px;min-height:1em;';
  wrapper.parentNode.insertBefore(statusLine, wrapper.nextSibling);

  let debounceTimer;
  function hideList(){ list.style.display = 'none'; list.innerHTML = ''; }

  inputEl.addEventListener('input', () => {
    inputEl._geo = null; // typing invalidates any previously clicked suggestion
    clearTimeout(debounceTimer);
    const q = inputEl.value.trim();
    if(q.length < 3){ hideList(); statusLine.textContent = ''; return; }
    statusLine.textContent = 'Søger…';
    debounceTimer = setTimeout(async () => {
      const token = localStorage.getItem('mapboxToken');
      if(!token){ statusLine.textContent = 'Ingen Mapbox-token fundet.'; return; }
      try{
        const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${token}&limit=5&types=poi,place`;
        const res = await fetch(url);
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const feats = data.features || [];
        if(!feats.length){ hideList(); statusLine.textContent = 'Ingen resultater for "' + q + '".'; return; }
        statusLine.textContent = '';
        list.innerHTML = feats.map((f, i) => `<div class="suggest-item" data-i="${i}">${f.place_name}</div>`).join('');
        list.style.display = 'block';
        list.querySelectorAll('.suggest-item').forEach(item => {
          item.addEventListener('mousedown', (e) => {
            e.preventDefault(); // keep focus/blur from closing the list before the click registers
            const f = feats[Number(item.dataset.i)];
            inputEl.value = f.place_name;
            inputEl._geo = { lng: f.center[0], lat: f.center[1], placeName: f.place_name };
            hideList();
          });
        });
      }catch(e){
        hideList();
        statusLine.textContent = 'Fejl ved søgning: ' + e.message;
      }
    }, 350);
  });
  inputEl.addEventListener('blur', () => { setTimeout(hideList, 150); });
}

async function resolveLocationInput(inputEl, token, country){
  const raw = inputEl.value.trim();
  if(inputEl._geo && inputEl._geo.placeName === raw){
    return { address: raw, res: inputEl._geo }; // person picked this from the dropdown — trust it directly
  }
  const cleaned = sanitizeAddressQuery(raw);
  const coords = parseCoordsFromInput(cleaned);
  if(coords){
    const rev = await reverseGeocode(coords.lng, coords.lat, token);
    return { address: rev || cleaned, res: { lng: coords.lng, lat: coords.lat, placeName: rev || cleaned } };
  }
  const res = await geocode(cleaned, token, country);
  return { address: cleaned, res };
}

function parseBookingUrl(url){
  try{
    const u = new URL(url);
    if(!/booking\.com$/.test(u.hostname.replace(/^www\./,''))) return null;
    const parts = u.pathname.split('/').filter(Boolean); // e.g. ['hotel','it','hotel-danieli.en-gb.html']
    const idx = parts.indexOf('hotel');
    if(idx === -1 || !parts[idx+1] || !parts[idx+2]) return null;
    const country = parts[idx+1];
    const slug = parts[idx+2].split('.')[0];
    const name = slug.replace(/-/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    return { country, name };
  }catch(e){ return null; }
}

async function geocode(query, token, country, types){
  let url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${token}&limit=1`;
  if(country) url += `&country=${encodeURIComponent(country)}`;
  if(types) url += `&types=${encodeURIComponent(types)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Geocoding fejlede');
  const data = await res.json();
  if(!data.features || !data.features.length) throw new Error('Kunne ikke finde stedet');
  const f = data.features[0];
  return { lng: f.center[0], lat: f.center[1], placeName: f.place_name };
}

async function fetchBookingMeta(url){
  try{
    const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
    if(!res.ok) return null;
    const json = await res.json();
    if(json.status !== 'success' || !json.data) return null;
    return {
      imageUrl: json.data.image ? json.data.image.url : null,
      title: json.data.title || null,
      description: json.data.description || null
    };
  }catch(e){ return null; }
}

function extractLocalityFromDescription(desc){
  if(!desc) return null;
  const m = desc.match(/(?:located in|beliggende i)\s+([A-ZÆØÅ][\wÆØÅæøå'\- ]{2,30})/i);
  return m ? m[1].trim().replace(/[.,]$/,'') : null;
}

function parseBookingTitle(rawTitle){
  if(!rawTitle) return { name: null, locality: null };
  let title = rawTitle
    .replace(/\s*[-–|]\s*Opdaterede?\s*priser.*$/i, '')
    .replace(/\s*[-–|]\s*Updated\s*\d{4}.*$/i, '')
    .replace(/\s*[-–|]\s*Booking\.com.*$/i, '')
    .trim();
  let locality = null;
  const parenMatch = title.match(/\(([^)]+)\)/);
  if(parenMatch){
    locality = parenMatch[1].trim();
    title = title.replace(parenMatch[0], '').trim();
  }else{
    const parts = title.split(',');
    if(parts.length > 1){
      locality = parts.slice(1).join(',').trim();
      title = parts[0].trim();
    }
  }
  return { name: title || null, locality };
}

function sanitizeAddressQuery(str){
  if(!str) return str;
  // "Km. 19,8" -> "Km. 19.8" — a decimal comma between digits is not an address-part separator
  return str.replace(/(\d),(\d)/g, '$1.$2');
}

function parseCoordsFromInput(str){
  if(!str) return null;
  const isValid = (lat, lng) => Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
  // Plain "lat, lng" pair, e.g. "-8.552, 115.313"
  const direct = str.match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if(direct){
    const lat = parseFloat(direct[1]), lng = parseFloat(direct[2]);
    if(isValid(lat, lng)) return { lat, lng };
  }
  // Coordinates embedded in a Google Maps link, e.g. .../@-8.552,115.313,15z or ?q=-8.552,115.313
  const urlMatch = str.match(/[@=](-?\d{1,3}\.\d+),(-?\d{1,3}\.\d+)/);
  if(urlMatch){
    const lat = parseFloat(urlMatch[1]), lng = parseFloat(urlMatch[2]);
    if(isValid(lat, lng)) return { lat, lng };
  }
  return null;
}

document.getElementById('addStop').addEventListener('click', async () => {
  const name = document.getElementById('stopName').value.trim();
  const type = document.getElementById('stopType').value;
  const leg = isLegType(type);
  const address = sanitizeAddressQuery(document.getElementById('stopAddress').value.trim());
  const bookingUrl = type === 'hotel' ? document.getElementById('bookingUrl').value.trim() : '';
  const manualImageUrl = type === 'hotel' ? document.getElementById('imageUrlInput').value.trim() : '';
  const fromAddress = sanitizeAddressQuery(document.getElementById('stopFrom').value.trim());
  const toAddress = sanitizeAddressQuery(document.getElementById('stopTo').value.trim());
  const start = document.getElementById('stopStart').value;
  const end = document.getElementById('stopEnd').value;
  const statusEl = document.getElementById('addStatus');
  const token = localStorage.getItem('mapboxToken');

  if(!token){ statusEl.textContent = 'Indsæt din Mapbox-token øverst først.'; statusEl.className='status err'; return; }
  if(!start){ statusEl.textContent = 'Udfyld startdato.'; statusEl.className='status err'; return; }
  if(!name && !(type === 'hotel' && bookingUrl)){ statusEl.textContent = 'Udfyld navn, eller indsæt et Booking.com-link.'; statusEl.className='status err'; return; }
  if(leg && (!fromAddress || !toAddress)){ statusEl.textContent = 'Udfyld både fra- og til-destination.'; statusEl.className='status err'; return; }
  if(!leg && !address && !bookingUrl){ statusEl.textContent = 'Udfyld adresse/navn, eller indsæt et Booking.com-link.'; statusEl.className='status err'; return; }

  statusEl.textContent = 'Slår adresse(r) op...';
  statusEl.className = 'status';
  const addBtn = document.getElementById('addStop');
  const busyLabel = editingId ? 'Gem ændring' : 'Tilføj til rejsen';
  addBtn.disabled = true;
  addBtn.innerHTML = '<span class="spinner"></span>Arbejder…';
  try{
    let stop = { id: Date.now(), name, type, start, end: end||start };
    if(leg){
      const [fromResult, toResult] = await Promise.all([
        resolveLocationInput(document.getElementById('stopFrom'), token),
        resolveLocationInput(document.getElementById('stopTo'), token)
      ]);
      const fromRes = fromResult.res, toRes = toResult.res;
      const resolvedFromAddress = fromResult.address, resolvedToAddress = toResult.address;
      let vias = [];
      if(type === 'fly'){
        const viaInputs = Array.from(document.querySelectorAll('.via-input')).filter(i => i.value.trim());
        if(viaInputs.length){
          const viaResults = await Promise.all(viaInputs.map(i => resolveLocationInput(i, token)));
          vias = viaResults.map(r => ({ address: r.address, lng: r.res.lng, lat: r.res.lat }));
        }
      }
      stop = { ...stop, fromAddress: resolvedFromAddress, fromLng: fromRes.lng, fromLat: fromRes.lat, toAddress: resolvedToAddress, toLng: toRes.lng, toLat: toRes.lat, vias };
    }else{
      let bookingMeta = null;
      if(type === 'hotel' && bookingUrl && (!manualImageUrl || !address)){
        bookingMeta = await fetchBookingMeta(bookingUrl);
      }
      let titleName = null, country = null;
      if(bookingMeta && bookingMeta.title){
        titleName = parseBookingTitle(bookingMeta.title).name;
      }
      if(type === 'hotel' && bookingUrl){
        const parsedUrl = parseBookingUrl(bookingUrl);
        if(parsedUrl){ country = parsedUrl.country; if(!titleName) titleName = parsedUrl.name; }
      }

      let res, finalAddress;
      if(address){
        const coords = parseCoordsFromInput(address);
        if(coords){
          // Exact coordinates given — no text search involved, just confirm the human-readable address.
          const rev = await reverseGeocode(coords.lng, coords.lat, token);
          res = { lng: coords.lng, lat: coords.lat, placeName: rev || address };
          finalAddress = rev || address;
        }else{
          // The person typed the address themselves — still goes through Mapbox's text search,
          // but we bias it toward actual address/POI matches rather than broad region matches.
          try{
            res = await geocode(address, token, country, 'address,poi');
          }catch(e1){
            res = await geocode(address, token, country);
          }
          finalAddress = address;
        }
      }else{
        let titleLocality = null;
        if(bookingMeta && bookingMeta.title){
          titleLocality = parseBookingTitle(bookingMeta.title).locality;
        }
        if(!titleLocality && bookingMeta && bookingMeta.description){
          titleLocality = extractLocalityFromDescription(bookingMeta.description);
        }
        if(!titleName) throw new Error('Kunne ikke udlede et navn fra linket');
        const query = titleLocality ? `${titleName}, ${titleLocality}` : titleName;
        try{
          res = await geocode(query, token, country, 'poi');
        }catch(e1){
          try{ res = await geocode(query, token, country); }
          catch(e2){ res = await geocode(titleName, token, country); }
        }
        finalAddress = res.placeName; // the app's best estimate — stored so it can be seen and corrected later
      }
      stop.name = name || titleName || finalAddress;
      const resolvedImage = manualImageUrl || (bookingMeta ? bookingMeta.imageUrl : null);
      stop = { ...stop, address: finalAddress, placeName: res.placeName, bookingUrl: bookingUrl || undefined, imageUrl: resolvedImage, lng: res.lng, lat: res.lat };
    }
    stop.id = editingId || stop.id;
    if(editingId){
      const idx = stops.findIndex(x => x.id === editingId);
      if(idx !== -1) stops[idx] = stop; else stops.push(stop);
    }else{
      stops.push(stop);
    }
    const wasEditing = !!editingId;
    editingId = null;
    saveStops();
    renderAll();
    document.getElementById('stopName').value = '';
    document.getElementById('stopAddress').value = '';
    document.getElementById('bookingUrl').value = '';
    document.getElementById('imageUrlInput').value = '';
    document.getElementById('stopFrom').value = '';
    document.getElementById('stopFrom')._geo = null;
    document.getElementById('stopTo').value = '';
    document.getElementById('stopTo')._geo = null;
    document.getElementById('stopStart').value = '';
    document.getElementById('stopEnd').value = '';
    document.getElementById('stopEnd').min = '';
    document.getElementById('viaContainer').innerHTML = '';
    document.getElementById('addStop').textContent = 'Tilføj til rejsen';
    document.getElementById('cancelEdit').style.display = 'none';
    statusEl.textContent = wasEditing ? 'Ændring gemt ✓' : 'Tilføjet ✓';
    statusEl.className = 'status ok';
  }catch(e){
    statusEl.textContent = 'Kunne ikke finde adressen(erne) — prøv en mere specifik søgning eller andet link.';
    statusEl.className = 'status err';
    addBtn.textContent = busyLabel;
  }
  addBtn.disabled = false;
});

function renderList(){
  const list = document.getElementById('stopList');
  updateTripSummary();
  if(!stops.length){
    list.innerHTML = '<div class="empty">Ingen etaper endnu. Tilføj din første ovenfor.</div>';
    return;
  }
  const sorted = [...stops].sort((a,b) => a.start.localeCompare(b.start) || (a.end||a.start).localeCompare(b.end||b.start));
  list.innerHTML = sorted.map((s, i) => `
    <div class="stop-row">
      <div class="stop-rail">
        <span class="seq-badge">${i+1}</span>
        ${i < sorted.length - 1 ? '<div class="rail-line"></div>' : ''}
      </div>
      <div class="stop" data-id="${s.id}" style="cursor:pointer;">
        <div class="stop-stub">${typeIcon(s.type)}</div>
        <button class="edit" data-id="${s.id}" title="Rediger">✎</button>
        <button class="del" data-id="${s.id}" title="Fjern">✕</button>
        <div class="stop-body">
          <div class="type">${typeLabel(s.type)}</div>
          <div class="name">${s.name}</div>
          ${isLegType(s.type) ? `<div class="dates">${[s.fromAddress, ...(s.vias||[]).map(v=>v.address), s.toAddress].join(' → ')}</div>` : `<div class="dates">${s.placeName || s.address}</div>`}
          <div class="dates">${s.start}${s.end && s.end!==s.start ? ' → '+s.end : ''}</div>
        </div>
      </div>
    </div>`).join('');
  list.querySelectorAll('.edit').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); editStop(Number(btn.dataset.id)); });
  });
  list.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = Number(btn.dataset.id);
      const s = stops.find(x => x.id === id);
      if(confirm(`Er du sikker på, at du vil slette "${s ? s.name : 'denne etape'}"?`)) removeStop(id);
    });
  });
  list.querySelectorAll('.stop').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('button')) return;
      flyToStop(Number(el.dataset.id));
    });
  });
}

function flyToStop(id){
  if(!map || !mapLoaded) return;
  const entry = markerIndex[id];
  if(!entry || !entry.markers.length) return;
  const coordsList = entry.markers.map(m => m.getLngLat());
  if(coordsList.length === 1){
    map.flyTo({ center: coordsList[0], zoom: Math.max(map.getZoom(), 13) });
  }else{
    const b = new mapboxgl.LngLatBounds();
    coordsList.forEach(c => b.extend(c));
    map.fitBounds(b, { padding: 80, maxZoom: 13 });
  }
  entry.markers[0].togglePopup();
  if(window.innerWidth <= 768 && sidebarEl && !sidebarEl.classList.contains('collapsed')){
    setSidebarCollapsed(true);
  }
}

function nightsBetween(startStr, endStr){
  const start = new Date(startStr);
  const end = new Date(endStr || startStr);
  const diffDays = Math.round((end - start) / 86400000);
  return diffDays + 1; // both the start and end date counted inclusive
}

const DA_MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
function formatDaDate(dateStr){
  const d = new Date(dateStr);
  return `${d.getDate()}. ${DA_MONTHS[d.getMonth()]}`;
}

function updateTripSummary(){
  const el = document.getElementById('tripSummary');
  if(!el) return;
  if(!stops.length){ el.textContent = ''; return; }
  const minStart = stops.map(s => s.start).reduce((a,b) => a < b ? a : b);
  const maxEnd = stops.map(s => s.end || s.start).reduce((a,b) => a > b ? a : b);
  const nights = nightsBetween(minStart, maxEnd);
  const startD = new Date(minStart), endD = new Date(maxEnd);
  const sameMonth = startD.getMonth() === endD.getMonth() && startD.getFullYear() === endD.getFullYear();
  const dateRange = sameMonth
    ? `${startD.getDate()}.–${formatDaDate(maxEnd)}`
    : `${formatDaDate(minStart)} – ${formatDaDate(maxEnd)}`;
  el.textContent = `${stops.length} etape${stops.length===1?'':'r'} · ${dateRange} · ${nights} overnatning${nights===1?'':'er'}`;
}

function editButtonHtml(id){
  return `<div style="margin-top:8px;"><button onclick="editStop(${id})" style="width:auto;background:transparent;border:1px solid var(--line);color:var(--text);padding:4px 10px;border-radius:6px;font-size:0.78rem;cursor:pointer;">✎ Rediger</button></div>`;
}

function buildPointPopup(s){
  let html = '';
  if(s.imageUrl){
    html += `<img src="${s.imageUrl}" alt="${s.name}" style="width:100%;max-width:220px;height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px;display:block;" onerror="this.style.display='none';">`;
  }
  html += `<strong>${s.name}</strong>`;
  html += `<br>Ankomst: ${s.start}`;
  html += `<br>Afgang: ${s.end || s.start}`;
  const nights = nightsBetween(s.start, s.end);
  html += `<br>${nights} overnatning${nights === 1 ? '' : 'er'}`;
  if(s.bookingUrl){
    const linkLabel = /booking\.com/i.test(s.bookingUrl) ? 'Se på Booking.com →' : 'Besøg hjemmesiden →';
    html += `<br><a href="${s.bookingUrl}" target="_blank" rel="noopener" style="color:var(--popup-link);">${linkLabel}</a>`;
  }
  html += editButtonHtml(s.id);
  return html;
}

async function reverseGeocode(lng, lat, token){
  try{
    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?access_token=${token}&limit=1`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    return (data.features && data.features.length) ? data.features[0].place_name : null;
  }catch(e){ return null; }
}

function addPointMarker(lng, lat, popupHtml, color, opts){
  opts = opts || {};
  const el = document.createElement('div');
  const size = opts.label ? 22 : 14;
  el.style.width = size+'px'; el.style.height = size+'px'; el.style.borderRadius='50%';
  el.style.background = color; el.style.border = '2px solid #1a1006';
  el.style.boxShadow = '0 2px 5px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.15)';
  el.style.cursor = opts.draggable ? 'grab' : 'pointer';
  if(opts.label){
    el.style.display='flex'; el.style.alignItems='center'; el.style.justifyContent='center';
    el.style.color='#1a1006'; el.style.fontSize='11px'; el.style.fontWeight='700'; el.style.fontFamily="'Inter',sans-serif";
    el.textContent = opts.label;
  }
  const colorClassMap = { 'var(--accent)':'popup-accent', 'var(--fly)':'popup-fly', 'var(--train)':'popup-train', 'var(--boat)':'popup-boat' };
  const marker = new mapboxgl.Marker({ element: el, draggable: !!opts.draggable })
    .setLngLat([lng, lat])
    .setPopup(new mapboxgl.Popup({offset:12, maxWidth:'260px', className: colorClassMap[color] || ''}).setHTML(popupHtml))
    .addTo(map);
  if(opts.draggable && opts.stopId){
    marker.on('dragend', async () => {
      const pos = marker.getLngLat();
      const s = stops.find(x => x.id === opts.stopId);
      if(!s) return;
      const token = localStorage.getItem('mapboxToken');
      const rev = await reverseGeocode(pos.lng, pos.lat, token);
      if(opts.field === 'from'){
        s.fromLng = pos.lng; s.fromLat = pos.lat;
        if(rev) s.fromAddress = rev;
      }else if(opts.field === 'to'){
        s.toLng = pos.lng; s.toLat = pos.lat;
        if(rev) s.toAddress = rev;
      }else if(opts.field === 'via' && s.vias && s.vias[opts.viaIndex]){
        s.vias[opts.viaIndex].lng = pos.lng; s.vias[opts.viaIndex].lat = pos.lat;
        if(rev) s.vias[opts.viaIndex].address = rev;
      }else{
        s.lng = pos.lng; s.lat = pos.lat;
        if(rev) s.placeName = rev;
      }
      saveStops();
      renderAll(); // rebuilds markers AND the route/leg lines so they follow the new position
    });
  }
  markers.push(marker);
  if(opts.stopId != null){
    if(!markerIndex[opts.stopId]) markerIndex[opts.stopId] = { markers: [] };
    markerIndex[opts.stopId].markers.push(marker);
  }
}

function arcCoords(a, b, segments, bend){
  segments = segments || 24;
  bend = bend === undefined ? 0.12 : bend;
  const [x1,y1] = a, [x2,y2] = b;
  const dx = x2-x1, dy = y2-y1;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if(dist === 0) return [a, b];
  const px = -dy/dist, py = dx/dist; // perpendicular unit vector
  const midX = (x1+x2)/2 + px*dist*bend;
  const midY = (y1+y2)/2 + py*dist*bend;
  const coords = [];
  for(let i=0; i<=segments; i++){
    const t = i/segments, mt = 1-t;
    coords.push([mt*mt*x1 + 2*mt*t*midX + t*t*x2, mt*mt*y1 + 2*mt*t*midY + t*t*y2]);
  }
  return coords;
}

function buildArcedPath(points){
  if(points.length < 2) return points;
  let coords = [];
  for(let i=0; i<points.length-1; i++){
    const seg = arcCoords(points[i], points[i+1]);
    coords = coords.concat(i === 0 ? seg : seg.slice(1)); // drop duplicate shared point at each join
  }
  return coords;
}

function addLineIcon(coordsPath, icon, bgColor){
  let midLng, midLat;
  if(coordsPath.length === 2){
    midLng = (coordsPath[0][0] + coordsPath[1][0]) / 2;
    midLat = (coordsPath[0][1] + coordsPath[1][1]) / 2;
  }else{
    const mid = coordsPath[Math.floor(coordsPath.length/2)];
    midLng = mid[0]; midLat = mid[1];
  }
  const el = document.createElement('div');
  el.style.cssText = `width:24px;height:24px;border-radius:50%;background:${bgColor};display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid #1a1006;box-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none;`;
  el.innerHTML = icon;
  const marker = new mapboxgl.Marker({ element: el }).setLngLat([midLng, midLat]).addTo(map);
  markers.push(marker);
}

function renderMap(){
  if(!map) return;
  markers.forEach(m => m.remove());
  markers = [];
  markerIndex = {};
  const sorted = [...stops].sort((a,b) => a.start.localeCompare(b.start) || (a.end||a.start).localeCompare(b.end||b.start));
  const bounds = new mapboxgl.LngLatBounds();
  const routeAnchors = []; // one representative point per stop, in order, for the overview line
  const routeAnchorEnd = []; // parallel array: end date of the stop owning that anchor point
  const todayStr = new Date().toISOString().slice(0,10);

  sorted.forEach((s, i) => {
    const seq = String(i+1);
    const stopEnd = s.end || s.start;
    if(isLegType(s.type)){
      const color = legColor(s.type);
      addPointMarker(s.fromLng, s.fromLat, `<strong>${s.name}</strong><br>Afgang: ${s.fromAddress}${editButtonHtml(s.id)}`, color, { label: seq, draggable: true, stopId: s.id, field: 'from' });
      (s.vias||[]).forEach((v, vi) => {
        addPointMarker(v.lng, v.lat, `<strong>${s.name}</strong><br>Mellemlanding: ${v.address}${editButtonHtml(s.id)}`, color, { draggable: true, stopId: s.id, field: 'via', viaIndex: vi });
        bounds.extend([v.lng, v.lat]);
      });
      addPointMarker(s.toLng, s.toLat, `<strong>${s.name}</strong><br>Ankomst: ${s.toAddress}${editButtonHtml(s.id)}`, color, { label: seq, draggable: true, stopId: s.id, field: 'to' });
      bounds.extend([s.fromLng, s.fromLat]);
      bounds.extend([s.toLng, s.toLat]);
      routeAnchors.push([s.fromLng, s.fromLat]); // arrive at departure point first
      routeAnchorEnd.push(stopEnd);
      (s.vias||[]).forEach(v => { routeAnchors.push([v.lng, v.lat]); routeAnchorEnd.push(stopEnd); });
      routeAnchors.push([s.toLng, s.toLat]); // then continue from the arrival point
      routeAnchorEnd.push(stopEnd);
      const legPath = buildArcedPath([[s.fromLng, s.fromLat], ...(s.vias||[]).map(v=>[v.lng, v.lat]), [s.toLng, s.toLat]]);
      addLineIcon(legPath, legIcon(s.type), color);
    }else{
      addPointMarker(s.lng, s.lat, buildPointPopup(s), 'var(--accent)', { draggable: true, stopId: s.id, label: seq });
      bounds.extend([s.lng, s.lat]);
      routeAnchorEnd.push(stopEnd);
      routeAnchors.push([s.lng, s.lat]);
    }
  });

  for(let i=0; i<sorted.length-1; i++){
    const a = sorted[i], b = sorted[i+1];
    if(a.type === 'hotel' && b.type === 'hotel'){
      addLineIcon([[a.lng, a.lat], [b.lng, b.lat]], iconSvg('car', { size: 15, stroke: '#1a1006' }), '#D9D9D9');
    }
  }

  ['route','legs'].forEach(id => {
    if(map.getLayer(id)) map.removeLayer(id);
    if(map.getSource(id)) map.removeSource(id);
  });

  if(routeAnchors.length > 1){
    const routeFeatures = [];
    for(let i=0; i<routeAnchors.length-1; i++){
      routeFeatures.push({
        type:'Feature',
        properties:{ isPast: routeAnchorEnd[i+1] < todayStr },
        geometry:{ type:'LineString', coordinates: arcCoords(routeAnchors[i], routeAnchors[i+1]) }
      });
    }
    map.addSource('route', {
      type: 'geojson',
      data: { type:'FeatureCollection', features: routeFeatures }
    });
    map.addLayer({
      id:'route', type:'line', source:'route',
      layout:{ 'line-join':'round', 'line-cap':'round' },
      paint:{
        'line-color':'#4FB0A5', 'line-width':2, 'line-dasharray':[2,1],
        'line-opacity': ['case', ['get','isPast'], 0.28, 0.9]
      }
    });
  }

  const legStops = sorted.filter(s => isLegType(s.type));
  if(legStops.length){
    map.addSource('legs', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: legStops.map(s => ({
          type: 'Feature',
          properties: { name: s.name, type: s.type, isPast: (s.end || s.start) < todayStr },
          geometry: { type: 'LineString', coordinates: buildArcedPath([[s.fromLng, s.fromLat], ...(s.vias||[]).map(v=>[v.lng, v.lat]), [s.toLng, s.toLat]]) }
        }))
      }
    });
    map.addLayer({
      id:'legs', type:'line', source:'legs',
      layout:{ 'line-join':'round', 'line-cap':'round' },
      paint:{
        'line-color': ['match', ['get','type'], 'fly', '#8ECFEB', 'train', '#9099A6', 'transport', '#1B4B72', '#6FA8DC'],
        'line-width':3,
        'line-opacity': ['case', ['get','isPast'], 0.3, 1]
      }
    });
  }

  if(sorted.length && !hasFitBounds){
    map.fitBounds(bounds, { padding: 60, maxZoom: 12 });
    hasFitBounds = true;
  }
}

function renderAll(){ renderList(); if(mapLoaded) renderMap(); }

const sidebarEl = document.querySelector('.sidebar');
const sidebarToggleBtn = document.getElementById('sidebarToggle');
function setSidebarCollapsed(collapsed){
  sidebarEl.classList.toggle('collapsed', collapsed);
  sidebarToggleBtn.textContent = collapsed ? '›' : '‹';
  sidebarToggleBtn.title = collapsed ? 'Vis panel' : 'Minimer panel';
  try{ localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0'); }catch(e){}
  setTimeout(() => { if(map) map.resize(); }, 220); // after the CSS width transition finishes
}
sidebarToggleBtn.addEventListener('click', () => {
  setSidebarCollapsed(!sidebarEl.classList.contains('collapsed'));
});
const storedSidebarPref = localStorage.getItem('sidebarCollapsed');
const startCollapsed = storedSidebarPref !== null ? storedSidebarPref === '1' : window.innerWidth <= 768;
if(startCollapsed){
  sidebarEl.classList.add('collapsed');
  sidebarToggleBtn.textContent = '›';
  sidebarToggleBtn.title = 'Vis panel';
}

attachPlaceAutocomplete(document.getElementById('stopFrom'));
attachPlaceAutocomplete(document.getElementById('stopTo'));
toggleAddressFields();

function showAuthScreen(show){
  document.getElementById('authScreen').style.display = show ? 'flex' : 'none';
  document.getElementById('appRoot').style.display = show ? 'none' : 'flex';
}

document.getElementById('authLoginBtn').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  const statusEl = document.getElementById('authStatus');
  if(!email || !pass){ statusEl.textContent = 'Udfyld e-mail og adgangskode.'; statusEl.className = 'status err'; return; }
  statusEl.textContent = 'Logger ind…'; statusEl.className = 'status';
  try{
    await window.fbFns.signInWithEmailAndPassword(window.fbAuth, email, pass);
  }catch(e){
    statusEl.textContent = 'Login fejlede: ' + e.message; statusEl.className = 'status err';
  }
});

document.getElementById('authSignupBtn').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPassword').value;
  const statusEl = document.getElementById('authStatus');
  if(!email || !pass){ statusEl.textContent = 'Udfyld e-mail og adgangskode.'; statusEl.className = 'status err'; return; }
  if(pass.length < 6){ statusEl.textContent = 'Adgangskoden skal være mindst 6 tegn.'; statusEl.className = 'status err'; return; }
  statusEl.textContent = 'Opretter bruger…'; statusEl.className = 'status';
  try{
    await window.fbFns.createUserWithEmailAndPassword(window.fbAuth, email, pass);
  }catch(e){
    statusEl.textContent = 'Oprettelse fejlede: ' + e.message; statusEl.className = 'status err';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  window.fbFns.signOut(window.fbAuth);
});

document.getElementById('authGoogleBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('authStatus');
  statusEl.textContent = 'Sender dig til Google…'; statusEl.className = 'status';
  try{
    const provider = new window.fbFns.GoogleAuthProvider();
    await window.fbFns.signInWithRedirect(window.fbAuth, provider); // navigates away; picks back up via onAuthStateChanged when the browser returns
  }catch(e){
    statusEl.textContent = 'Google-login fejlede: ' + e.message; statusEl.className = 'status err';
  }
});

function startAuthListener(){
  window.fbFns.getRedirectResult(window.fbAuth).catch((e) => {
    const statusEl = document.getElementById('authStatus');
    statusEl.textContent = 'Google-login fejlede: ' + e.message; statusEl.className = 'status err';
  });
  window.fbFns.onAuthStateChanged(window.fbAuth, async (user) => {
  try{
    if(user){
      currentUid = user.uid;
      document.getElementById('userEmailLabel').textContent = user.email || '';
      showAuthScreen(false);

      const cloudData = await loadUserDataFromCloud(user.uid);
      const localStops = loadStops();
      const localToken = localStorage.getItem('mapboxToken');

      if(cloudData.mapboxToken){
        localStorage.setItem('mapboxToken', cloudData.mapboxToken); // cloud is the source of truth once logged in
      }else if(localToken){
        await saveTokenToCloud(localToken); // first device to log in — seed the cloud copy
      }

      if(cloudData.stops.length === 0 && localStops.length > 0){
        const migrate = confirm(`Vi fandt ${localStops.length} etape(r) gemt på denne enhed. Vil du overføre dem til din konto (${user.email})?`);
        stops = migrate ? localStops : [];
        if(migrate) await saveStopsToCloud();
      }else{
        stops = cloudData.stops;
      }

      if(!map){
        mapLoaded = false;
        hasFitBounds = false;
        initMapbox();
      }else{
        hasFitBounds = false; // allow a fresh auto-fit for the newly loaded user's data
        renderAll();
      }
    }else{
      currentUid = null;
      stops = [];
      showAuthScreen(true);
    }
  }catch(e){
    console.error('Auth state handling failed', e);
    showAuthScreen(true);
    const statusEl = document.getElementById('authStatus');
    statusEl.textContent = 'Der opstod en fejl efter login: ' + e.message;
    statusEl.className = 'status err';
  }
  });
}

if(window.__fbReady){
  startAuthListener();
}else{
  window.addEventListener('firebase-ready', startAuthListener, { once: true });
}
</script>
